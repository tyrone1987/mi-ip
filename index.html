<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mi IP pública</title>
</head>
<body>
  <h1>Tu IP pública</h1>
  <p id="ip">Consultando...</p>

  <script>
    async function mostrarIP() {
      const elemento = document.getElementById("ip");

      try {
      const respuesta = await fetch(
  "https://api.ipify.org?format=json"
);

        if (!respuesta.ok) throw new Error("Error de consulta");

        const datos = await respuesta.json();
        elemento.textContent = datos.ip;
      } catch {
        elemento.textContent = "No se pudo consultar la IP.";
      }
    }

    mostrarIP();
  </script>
</body>
</html>
